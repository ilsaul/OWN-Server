apply plugin:'application'
application {
	mainClass = "org.programmatori.iot.own.server.OWNServer"
	applicationDefaultJvmArgs = ["-Dlogback.configurationFile=conf/logback.xml"]
}
// -Dlogging.config="/Users/moreno/Programmazione/git/my/OWN/OWNServer/conf/logback.xml"

version = '0.5.0'
jar {
	manifest {
		attributes 'Implementation-Title': project.name,
		'Implementation-Version': project.version,
		'Built-By': System.getProperty('user.name'),
		'Built-JDK': System.getProperty('java.version'),
		'Built-Host': InetAddress.getLocalHost().getHostName(),
		'Built-Date': new Date(),
		'Source-Compatibility': java.sourceCompatibility,
		'Target-Compatibility': java.targetCompatibility
	}
}

dependencies {
	implementation project(':OWN-SDK')

	runtimeOnly project(':OWNEngine-Emulator')
	runtimeOnly project(':OWNEngine-L4686Sdk')
	//runtime project(':OWNEngine-SCSGate')
	runtimeOnly project(':OWNPlugin-Map')
	runtimeOnly project(':OWNPlugin-Power')
	runtimeOnly project(':OWNPlugin-Remote')
	runtimeOnly project(':OWNPlugin-System')
	//runtime project(':OWNPlugin-HomeKit')

}

startScripts {
	classpath += files('src/dist/conf')
	doLast {
		def windowsScriptFile = file getWindowsScript()
		def unixScriptFile    = file getUnixScript()
		windowsScriptFile.text = windowsScriptFile.text.replace('%APP_HOME%\\lib\\conf', '%APP_HOME%\\conf')
		unixScriptFile.text  = unixScriptFile.text.replace('$APP_HOME/lib/conf', '$APP_HOME/conf')
	}
}
